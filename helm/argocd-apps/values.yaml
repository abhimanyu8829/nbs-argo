      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - SkipDryRunOnMissingResource=true
  opa-gatekeeper:
    chart: opa-gatekeeper-helm
    namespace: gatekeeper-system
    syncWave: "5"
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
  auth-api:
    chart: auth-api-helm
    namespace: auth-namespace
    syncWave: "10"
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    helmValues:
      replicaCount: 1
      hpa:
        enabled: false
        minReplicas: 1
      affinity:
        podAntiAffinity:
          enabled: false
      topologySpreadConstraints:
        enabled: false
      probes:
        readiness:
          path: /api/health
        liveness:
          path: /api/health
