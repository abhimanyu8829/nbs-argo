apiVersion: apps/v1
kind: Deployment
metadata:
  name: cockpit-api
  namespace: cockpit-namespace
  labels:
    app: cockpit-api
    managed-by: nitroberry
spec:
  strategy:
    type: {{ .Values.services.cockpit.strategyType | default "RollingUpdate" }}
  replicas: {{ .Values.services.cockpit.replicas }}
  selector:
    matchLabels:
      app: cockpit-api
  template:
    metadata:
      labels:
        app: cockpit-api
        managed-by: nitroberry
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: cockpit-api
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: cockpit-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: "{{ .Values.services.cockpit.api.repository }}:{{ .Values.services.cockpit.api.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: cockpit-api-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cockpit-api-secrets
                  key: database-url
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: worker
          image: "{{ .Values.services.cockpit.worker.repository }}:{{ .Values.services.cockpit.worker.tag }}"
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cockpit-api-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cockpit-api-secrets
                  key: database-url
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: cockpit-api-service
  namespace: cockpit-namespace
spec:
  selector:
    app: cockpit-api
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cockpit-api-hpa
  namespace: cockpit-namespace
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cockpit-api
  minReplicas: {{ .Values.services.cockpit.hpa.minReplicas }}
  maxReplicas: {{ .Values.services.cockpit.hpa.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cockpit-api-websecure
  namespace: cockpit-namespace
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`cockpit.nitroberry.com`)
      kind: Rule
      services:
        - name: cockpit-api-service
          port: 8080
      middlewares:
        - name: rate-limit
          namespace: traefik-ingress
        - name: security-headers
          namespace: traefik-ingress
  tls:
    certResolver: myresolver
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cockpit-api-policy
  namespace: cockpit-namespace
spec:
  podSelector:
    matchLabels:
      app: cockpit-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik-ingress
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: database-namespace
      podSelector:
        matchLabels:
          app: pgbouncer
    ports:
    - protocol: TCP
      port: 6432
