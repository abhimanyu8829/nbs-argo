{{- range $name, $app := .Values.applications }}
{{- $helmValues := dict }}
{{- if $app.helmValues }}
{{- $helmValues = mergeOverwrite (deepCopy ($.Values.global.appHelmValues | default dict)) $app.helmValues }}
{{- end }}

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name | quote }}
  namespace: {{ $.Values.global.argocdNamespace | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $app.syncWave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  source:
    {{- if eq $app.sourceType "oci" }}
    # OCI Helm chart pulled directly from ECR. repoURL must be the bare
    # registry hostname (NO oci:// prefix, NO trailing path) - ArgoCD's
    # OCI credential lookup only matches this exact format. The full
    # chart path (including the "nitroberry/" namespace) goes in `chart`.
    repoURL: {{ $.Values.global.ecrRegistryRoot | quote }}
    chart: {{ printf "nitroberry/%s" $app.chart | quote }}
    targetRevision: {{ index $.Values.chartTags $name | quote }}
    {{- else }}
    repoURL: {{ $.Values.global.repoURL | quote }}
    targetRevision: argocdTest
    path: helm/{{ $app.chart | replace "-helm" "" }}
    {{- end }}

    {{- if $helmValues }}
    helm:
      values: |
{{ toYaml $helmValues | indent 8 }}
    {{- end }}

  destination:
    server: {{ $.Values.global.destinationServer | quote }}
    namespace: {{ $app.namespace | quote }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
{{- range $option := $app.syncOptions }}
      - {{ $option }}
{{- end }}

---
{{- end }}
