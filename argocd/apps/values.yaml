global:
  argocdNamespace: argocd
  destinationServer: https://kubernetes.default.svc
  repoURL: https://github.com/abhimanyu8829/nbs-argo.git
  ecrRepoUrl: oci://798701233691.dkr.ecr.ap-south-1.amazonaws.com/nitroberry

  appHelmValues:
    imagePullSecrets:
      - name: ecr-registry-secret

chartTags:
  metallb: "1.0.0"
  postgres: "1.0.0"
  pgbouncer: "1.0.0"
  redis: "1.0.0"
  traefik: "1.0.0"
  opa-gatekeeper: "1.0.0"
  external-secrets: "1.0.0"
  external-secrets-config: "1.0.0"
  reloader: "1.0.0"

applications:
  metallb:
    chart: metallb-helm
    namespace: metallb-system
    syncWave: "1"
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - SkipDryRunOnMissingResource=true
  postgres:
    chart: postgres-helm
    namespace: database-namespace
    syncWave: "2"
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
  pgbouncer:
    chart: pgbouncer-helm
    namespace: database-namespace
    syncWave: "3"
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
  redis:
    chart: redis-helm
    namespace: database-namespace
    syncWave: "3"
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
  traefik:
    chart: traefik-helm
    namespace: traefik-ingress
    syncWave: "4"
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - SkipDryRunOnMissingResource=true
  opa-gatekeeper:
    chart: opa-gatekeeper-helm
    namespace: gatekeeper-system
    syncWave: "5"
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
  external-secrets:
    chart: external-secrets-helm
    namespace: external-secrets
    syncWave: "6"
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - SkipDryRunOnMissingResource=true
  external-secrets-config:
    chart: external-secrets-config-helm
    namespace: external-secrets
    syncWave: "7"
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - SkipDryRunOnMissingResource=true
  reloader:
    chart: reloader-helm
    namespace: reloader
    syncWave: "8"
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - SkipDryRunOnMissingResource=true
