global:
  argocdNamespace: argocd
  destinationServer: https://kubernetes.default.svc
  repoURL: https://github.com/abhimanyu8829/nbs-argo.git

  # Bare ECR registry hostname - NO oci:// prefix, NO trailing path.
  # This is the exact format ArgoCD's OCI credential matching requires;
  # using oci://...  or appending /nitroberry here was the root cause of
  # every "basic credential not found" / path-resolution error hit while
  # debugging this. The "nitroberry/" namespace goes in each app's
  # `chart` field instead (see templates/applications.yaml).
  ecrRegistryRoot: 798701233691.dkr.ecr.ap-south-1.amazonaws.com

  appHelmValues:
    imagePullSecrets:
      - name: ecr-registry-secret

chartTags:
  # --- infra tier (git-sourced, chart tag unused but kept for consistency) ---
  metallb: "1.0.0"
  postgres: "1.0.0"
  pgbouncer: "1.0.0"
  redis: "1.0.0"
  traefik: "1.0.0"
  opa-gatekeeper: "1.0.0"
  external-secrets: "1.0.0"
  external-secrets-config: "1.0.0"
  reloader: "1.0.0"
  # --- app tier (OCI-sourced from ECR, real current versions) ---
  auth-api: "0.0.45"
  auth-worker: "0.0.45"
  cockpit-api: "0.0.149"
  cockpit-worker: "0.0.149"
  messenger-api: "0.0.8"
  social-api: "0.0.40"
  social-worker: "0.0.40"
  task-api: "0.0.35"
  task-worker: "0.0.35"
  vault-api: "0.0.39"
  vault-worker: "0.0.39"
  workflow-api: "0.0.85"
  workflow-worker: "0.0.85"

applications:
  # ============================================================
  # INFRA TIER - sourced from this Git repo's helm/<name> folders
  # ============================================================
  metallb:
    chart: metallb-helm
    namespace: metallb-system
    syncWave: "1"
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - SkipDryRunOnMissingResource=true
  postgres:
    chart: postgres-helm
    namespace: database-namespace
    syncWave: "2"
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
  pgbouncer:
    chart: pgbouncer-helm
    namespace: database-namespace
    syncWave: "3"
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
  redis:
    chart: redis-helm
    namespace: database-namespace
    syncWave: "3"
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
  traefik:
    chart: traefik-helm
    namespace: traefik-ingress
    syncWave: "4"
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - SkipDryRunOnMissingResource=true
  opa-gatekeeper:
    chart: opa-gatekeeper-helm
    namespace: gatekeeper-system
    syncWave: "5"
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
  external-secrets:
    chart: external-secrets-helm
    namespace: external-secrets
    syncWave: "6"
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - SkipDryRunOnMissingResource=true
  external-secrets-config:
    chart: external-secrets-config-helm
    namespace: external-secrets
    syncWave: "7"
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - SkipDryRunOnMissingResource=true
  reloader:
    chart: reloader-helm
    namespace: reloader
    syncWave: "8"
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - SkipDryRunOnMissingResource=true

  # ============================================================
  # APP TIER - sourced from ECR as OCI Helm charts (confirmed
  # working: real images pull, real pods start). Each currently
  # shows Degraded until azure-secret-sp is created and
  # ClusterSecretStore/azure-backend goes Valid - see README.
  # ============================================================
  auth-api:
    chart: auth-api-helm
    sourceType: oci
    namespace: auth-namespace
    syncWave: "10"
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
  auth-worker:
    chart: auth-worker-helm
    sourceType: oci
    namespace: auth-namespace
    syncWave: "20"
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
  cockpit-api:
