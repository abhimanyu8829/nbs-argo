      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
  vault-api:
    chart: vault-api-helm
    sourceType: oci
    namespace: vault-namespace
    syncWave: "11"
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
  vault-worker:
    chart: vault-worker-helm
    sourceType: oci
    namespace: vault-namespace
    syncWave: "21"
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
  workflow-api:
