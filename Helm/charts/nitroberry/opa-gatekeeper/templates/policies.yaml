---
# 6. BlockLatestTag
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: blocklatesttag
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    managed-by: nitroberry
spec:
  crd:
    spec:
      names:
        kind: BlockLatestTag
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package blocklatesttag

        violation[{"msg": msg}] {
          container := input.review.object.spec.template.spec.containers[_]
          endswith(container.image, ":latest")
          msg := sprintf("Container '%v' must not use ':latest' tag. Pin to a specific version.", [container.name])
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.template.spec.containers[_]
          not contains(container.image, ":")
          msg := sprintf("Container '%v' has no image tag. Pin to a specific version.", [container.name])
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: BlockLatestTag
metadata:
  name: block-latest-tag
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    managed-by: nitroberry
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet"]
    namespaces:
      - auth-namespace
      - cockpit-namespace
      - messenger-namespace
      - social-namespace
      - task-namespace
      - vault-namespace
      - workflow-namespace
      - database-namespace
