imagePullSecrets:
  - name: ecr-registry-secret

imageTags:
  authApi: &authApiTag "0.0.0.27"
  authWorker: &authWorkerTag "0.0.0.20"
  cockpitApi: &cockpitApiTag "local-test-1"
  cockpitWorker: &cockpitWorkerTag "local-test-1"
  messengerApi: &messengerApiTag "local-test-1"
  socialApi: &socialApiTag "local-test-1"
  socialWorker: &socialWorkerTag "0.0.0.15"
  taskApi: &taskApiTag "0.0.0.16"
  taskWorker: &taskWorkerTag "0.0.0.16"
  vaultApi: &vaultApiTag "local-test-1"
  vaultWorker: &vaultWorkerTag "0.0.0.13"
  workflowApi: &workflowApiTag "local-test-1"
  workflowWorker: &workflowWorkerTag "local-test-1"

database:
  sslMode: disable

redis:
  enabled: true
  host: redis-service.database-namespace.svc.cluster.local
  port: 6379
  password: ""
  image:
    repository: redis
    tag: 7-alpine
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

probes:
  readinessInitialDelaySeconds: 5
  livenessInitialDelaySeconds: 15

services:
  auth:
    replicas: 2
    strategyType: RollingUpdate
    hpa:
      minReplicas: 2
      maxReplicas: 10
    api:
      repository: 798701233691.dkr.ecr.ap-south-1.amazonaws.com/nitroberry/auth-api
      tag: *authApiTag
    worker:
      repository: 798701233691.dkr.ecr.ap-south-1.amazonaws.com/nitroberry/auth-worker
      tag: *authWorkerTag
  cockpit:
    replicas: 2
    strategyType: RollingUpdate
    hpa:
      minReplicas: 2
      maxReplicas: 10
    api:
      repository: 798701233691.dkr.ecr.ap-south-1.amazonaws.com/nitroberry/cockpit-api
      tag: *cockpitApiTag
    worker:
      repository: 798701233691.dkr.ecr.ap-south-1.amazonaws.com/nitroberry/cockpit-worker
      tag: *cockpitWorkerTag
  messenger:
    replicas: 2
    strategyType: RollingUpdate
    hpa:
      minReplicas: 2
      maxReplicas: 10
    api:
      repository: 798701233691.dkr.ecr.ap-south-1.amazonaws.com/nitroberry/messenger-api
      tag: *messengerApiTag
  social:
    replicas: 2
    strategyType: RollingUpdate
    hpa:
      minReplicas: 2
      maxReplicas: 10
    api:
      repository: 798701233691.dkr.ecr.ap-south-1.amazonaws.com/nitroberry/social-api
      tag: *socialApiTag
    worker:
      repository: 798701233691.dkr.ecr.ap-south-1.amazonaws.com/nitroberry/social-worker
      tag: *socialWorkerTag
  task:
    replicas: 2
    strategyType: RollingUpdate
    hpa:
      minReplicas: 2
      maxReplicas: 10
    api:
      repository: 798701233691.dkr.ecr.ap-south-1.amazonaws.com/nitroberry/task-api
      tag: *taskApiTag
    worker:
      repository: 798701233691.dkr.ecr.ap-south-1.amazonaws.com/nitroberry/task-worker
      tag: *taskWorkerTag
  vault:
    replicas: 2
    strategyType: RollingUpdate
    hpa:
      minReplicas: 2
      maxReplicas: 10
    api:
      repository: 798701233691.dkr.ecr.ap-south-1.amazonaws.com/nitroberry/vault-api
      tag: *vaultApiTag
    worker:
      repository: 798701233691.dkr.ecr.ap-south-1.amazonaws.com/nitroberry/vault-worker
      tag: *vaultWorkerTag
  workflow:
    replicas: 2
    strategyType: RollingUpdate
    hpa:
      minReplicas: 2
      maxReplicas: 10
    api:
      repository: 798701233691.dkr.ecr.ap-south-1.amazonaws.com/nitroberry/workflow-api
      tag: *workflowApiTag
    worker:
      repository: 798701233691.dkr.ecr.ap-south-1.amazonaws.com/nitroberry/workflow-worker
      tag: *workflowWorkerTag
