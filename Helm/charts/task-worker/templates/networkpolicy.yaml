{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.networkPolicy.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "task-worker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "task-worker.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.databaseNamespace }}
          podSelector:
            matchLabels:
              app: {{ .Values.networkPolicy.egress.pgbouncerApp }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.pgbouncerPort }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.databaseNamespace }}
          podSelector:
            matchLabels:
              app: {{ .Values.networkPolicy.egress.redisApp }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.redisPort }}
{{- end }}
