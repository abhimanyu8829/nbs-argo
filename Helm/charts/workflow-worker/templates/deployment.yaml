apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workflow-worker.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "workflow-worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategyType }}
  selector:
    matchLabels:
      {{- include "workflow-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "workflow-worker.selectorLabels" . | nindent 8 }}
        managed-by: {{ .Values.labels.managedBy | quote }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.affinity.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          {{- if .Values.affinity.podAntiAffinity.required }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "workflow-worker.selectorLabels" . | nindent 18 }}
              topologyKey: {{ .Values.affinity.podAntiAffinity.topologyKey }}
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "workflow-worker.selectorLabels" . | nindent 20 }}
                topologyKey: {{ .Values.affinity.podAntiAffinity.topologyKey }}
          {{- end }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "workflow-worker.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
        - name: workflow-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Values.config.name }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: database-url
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: db-password
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            {{- if .Values.volumes.pm2Runtime.enabled }}
            - name: pm2-runtime
              mountPath: {{ .Values.volumes.pm2Runtime.mountPath }}
            {{- end }}
            {{- if .Values.volumes.appLogs.enabled }}
            - name: app-logs
              mountPath: {{ .Values.volumes.appLogs.mountPath }}
            {{- end }}
      volumes:
        {{- if .Values.volumes.pm2Runtime.enabled }}
        - name: pm2-runtime
          emptyDir: {}
        {{- end }}
        {{- if .Values.volumes.appLogs.enabled }}
        - name: app-logs
          emptyDir: {}
        {{- end }}
